# Pre-commit hooks for code quality enforcement
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']  # keep Markdown hard line breaks
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  # Ruff and mypy run from the venv, i.e. the versions pinned in requirements.txt, exactly as
  # `make lint`, `make format-check`, `make type-check` and CI run them, so there is no second
  # version to keep in sync (and mypy sees the project's dependencies, e.g. streamlit's types).
  # Requires the venv on PATH: activate it (`source venv/bin/activate`) or use `make pre-commit`.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: mypy . --ignore-missing-imports --check-untyped-defs
        language: system
        types: [python]
        pass_filenames: false
